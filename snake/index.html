<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Snow - Alpine Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --snow-white: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-teal: #2dd4bf;
            --gold: #fbbf24;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #020617;
            font-family: 'Nunito', sans-serif;
            color: var(--snow-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: auto;
        }

        .casino-window {
            width: 420px;
            max-width: 100vw;
            min-height: 520px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 3px solid var(--accent-blue);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(56, 189, 248, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .header {
            background: rgba(15, 23, 42, 0.9);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            z-index: 10;
        }

        .title-badge {
            font-family: 'Fredoka One', cursive;
            color: var(--accent-blue);
            font-size: 13px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stat-item {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
        }

        .stat-item span { color: var(--gold); }

        .top-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            border: none;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }

        .game-canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            overflow-y: auto;
        }

        canvas {
            background: #090d16;
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            touch-action: none;
        }

        canvas.walls-active {
            border: 3px solid #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        canvas.walls-off {
            border: 3px dashed var(--accent-teal);
        }

        /* Botonera Pad para móviles en el Snake */
        .snake-dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 12px auto 6px auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .dpad-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dpad-btn {
            width: 52px;
            height: 52px;
            background: #1e293b;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(0.95);
        }

        .btn-start {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: 1px solid var(--accent-blue);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-start:hover { background: #0284c7; }

        /* MODALES */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            font-family: 'Fredoka One', cursive;
            color: var(--gold);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .top-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .top-item {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
        }

        .keyboard-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            margin-top: 4px;
        }

        .kb-row { display: flex; justify-content: center; gap: 3px; }
        .kb-key {
            background: #334155;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            width: 26px;
            height: 28px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .kb-key:active { background: var(--accent-blue); color: black; }
        .kb-key.wide { width: 48px; background: #475569; }

        .name-display {
            background: #020617;
            border: 1px solid var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 800;
            color: var(--snow-white);
            min-width: 140px;
            text-align: center;
            margin-bottom: 6px;
        }

        .crash-text {
            color: #ef4444;
            font-size: 22px;
            font-family: 'Fredoka One', cursive;
            text-shadow: 0 0 10px #ef4444;
            animation: shake 0.3s ease-in-out;
            margin-bottom: 10px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div class="casino-window">
        <!-- HEADER -->
        <div class="header">
            <div class="title-badge">
                <span>❄️</span> SNAKE SNOW
            </div>
            <div class="stats-bar">
                <div class="stat-item">PTS: <span id="score-val">0</span></div>
                <div class="stat-item">LVL: <span id="level-val">1</span></div>
                <button class="top-btn" onclick="openTopModal()">TOP 5</button>
            </div>
        </div>

        <!-- ÁREA DE JUEGO -->
        <div class="game-canvas-container">
            <canvas id="snakeCanvas" width="360" height="360"></canvas>

            <!-- BOTONERA PAD VIRTUAL -->
            <div class="snake-dpad">
                <div class="dpad-row">
                    <button type="button" class="dpad-btn up" onclick="setSnakeDirection('UP')">▲</button>
                </div>
                <div class="dpad-row">
                    <button type="button" class="dpad-btn left" onclick="setSnakeDirection('LEFT')">◄</button>
                    <button type="button" class="dpad-btn down" onclick="setSnakeDirection('DOWN')">▼</button>
                    <button type="button" class="dpad-btn right" onclick="setSnakeDirection('RIGHT')">►</button>
                </div>
            </div>

            <button class="btn-start" id="start-btn" onclick="startGame()">▶ Iniciar Partida de Snake</button>
        </div>

        <!-- MODAL TOP 5 -->
        <div class="modal-overlay" id="top-modal">
            <div class="modal-title">🏆 TOP 5 RIDERS</div>
            <div class="top-list" id="top-list-container"></div>
            <button class="btn-start" onclick="closeTopModal()" style="width: 100%;">CERRAR</button>
        </div>

        <!-- MODAL GAME OVER / REGISTRO RÉCORD -->
        <div class="modal-overlay" id="crash-modal">
            <div class="crash-text">💥 ¡Te despeñaste!!!!!</div>
            <div style="font-size: 12px; margin-bottom: 6px;" id="final-score-text">Puntuación: 0</div>
            <div class="name-display" id="name-display">ESCRIBE...</div>
            
            <div class="keyboard-container" id="keyboard"></div>
            
            <button class="btn-start" onclick="submitScore()" style="width: 100%; margin-top: 10px;">GUARDAR Y REINICIAR</button>
        </div>
    </div>

    <script>
        <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 18; // 20x20 casillas (360px / 18px)
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let level = 1;
    let speedMultiplier = 1;
    let applesEaten = 0;
    let gameLoop = null;
    let levelTimer = null;
    let isRunning = false;
    let obstacles = [];
    let playerName = "";

    // Web Audio API Synth
    let audioCtx = null;
    let musicTimer = null;
    let currentNoteIndex = 0;

    const tetrisMelody = [
        { note: 76, duration: 400 }, { note: 71, duration: 200 }, { note: 72, duration: 200 }, { note: 74, duration: 400 },
        { note: 72, duration: 200 }, { note: 71, duration: 200 }, { note: 69, duration: 400 }, { note: 69, duration: 200 },
        { note: 72, duration: 200 }, { note: 76, duration: 400 }, { note: 74, duration: 200 }, { note: 72, duration: 200 },
        { note: 71, duration: 600 }, { note: 72, duration: 200 }, { note: 74, duration: 400 }, { note: 76, duration: 400 },
        { note: 72, duration: 400 }, { note: 69, duration: 400 }, { note: 69, duration: 400 }
    ];

    let topScores = JSON.parse(localStorage.getItem('snake_snow_top')) || [
        { name: "POWDER_KING", score: 30 },
        { name: "SNOW_QUEEN", score: 22 },
        { name: "FREERIDER", score: 15 },
        { name: "CARVER", score: 10 },
        { name: "ROOKIE", score: 5 }
    ];

    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {
            console.log("Audio no soportado o bloqueado");
        }
    }

    function playTetrisNote() {
        if (!isRunning || !audioCtx) return;
        try {
            const noteData = tetrisMelody[currentNoteIndex];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            const freq = 440 * Math.pow(2, (noteData.note - 69) / 12);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.type = 'square';

            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (noteData.duration / 1000) * 0.8);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + (noteData.duration / 1000));

            currentNoteIndex = (currentNoteIndex + 1) % tetrisMelody.length;

            const nextDelay = (noteData.duration) / speedMultiplier;
            musicTimer = setTimeout(playTetrisNote, Math.max(100, nextDelay));
        } catch (e) {
            // Si el audio falla en móviles, el juego no se detiene
        }
    }

    function playCrashSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } catch(e) {}
    }

    function startGame() {
        initAudio();
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('crash-modal').classList.remove('active');

        snake = [
            { x: 5 * gridSize, y: 10 * gridSize },
            { x: 4 * gridSize, y: 10 * gridSize },
            { x: 3 * gridSize, y: 10 * gridSize }
        ];
        dx = gridSize;
        dy = 0;
        score = 0;
        level = 1;
        speedMultiplier = 1;
        applesEaten = 0;
        obstacles = [];
        isRunning = true;

        updateStats();
        spawnFood();
        
        clearInterval(gameLoop);
        clearInterval(levelTimer);
        clearTimeout(musicTimer);

        levelTimer = setInterval(() => {
            level++;
            speedMultiplier *= 1.5;
            if (level >= 3) generateObstacles();
            updateStats();
            restartLoop();
        }, 30000);

        restartLoop();
        draw(); // Pintar la serpiente de inmediato
        
        currentNoteIndex = 0;
        playTetrisNote();
    }

    function restartLoop() {
        if (gameLoop) clearInterval(gameLoop);
        const interval = Math.max(50, 160 / speedMultiplier);
        gameLoop = setInterval(step, interval);
    }

    function generateObstacles() {
        obstacles = [];
        const count = Math.min(10, (level - 2) * 3);
        for (let i = 0; i < count; i++) {
            let obsX, obsY;
            do {
                obsX = Math.floor(Math.random() * tileCount) * gridSize;
                obsY = Math.floor(Math.random() * tileCount) * gridSize;
            } while (
                (obsX === snake[0].x && obsY === snake[0].y) ||
                (obsX === food.x && obsY === food.y)
            );
            obstacles.push({ x: obsX, y: obsY });
        }
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * tileCount) * gridSize;
        food.y = Math.floor(Math.random() * tileCount) * gridSize;
    }

    function step() {
        if (!isRunning) return;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (level <= 3) {
            canvas.className = "walls-active";
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return gameOver();
            }
        } else {
            canvas.className = "walls-off";
            if (head.x < 0) head.x = canvas.width - gridSize;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - gridSize;
            if (head.y >= canvas.height) head.y = 0;
        }

        for (let segment of snake) {
            if (head.x === segment.x && head.y === segment.y) return gameOver();
        }

        if (level >= 3) {
            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) return gameOver();
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 1;
            applesEaten += 1;

            if (applesEaten % 3 === 0) {
                speedMultiplier += 0.5;
                restartLoop();
            }

            updateStats();
            spawnFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (level >= 3) {
            ctx.font = '14px sans-serif';
            for (let obs of obstacles) {
                ctx.fillText('🪨', obs.x + 2, obs.y + 14);
            }
        }

        ctx.font = '14px sans-serif';
        ctx.fillText('❄️', food.x + 2, food.y + 14);

        snake.forEach((segment, index) => {
            ctx.font = index === 0 ? '15px sans-serif' : '12px sans-serif';
            ctx.fillText('❄️', segment.x + 2, segment.y + 14);
        });
    }

    function gameOver() {
        isRunning = false;
        clearInterval(gameLoop);
        clearInterval(levelTimer);
        clearTimeout(musicTimer);
        playCrashSound();

        document.getElementById('final-score-text').innerText = `Puntuación obtenida: ${score} copos`;
        document.getElementById('crash-modal').classList.add('active');
        buildKeyboard();
    }

    function updateStats() {
        document.getElementById('score-val').innerText = score;
        document.getElementById('level-val').innerText = level;
    }

    // Teclado físico (PC)
    window.addEventListener('keydown', e => {
        if (!isRunning) return;
        if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) { dx = 0; dy = -gridSize; }
        if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) { dx = 0; dy = gridSize; }
        if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) { dx = -gridSize; dy = 0; }
        if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) { dx = gridSize; dy = 0; }
    });

    // Controles Táctiles (Botonera Pad Móvil)
    function setSnakeDirection(dir) {
        if (!isRunning) return;
        if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
        if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
        if (dir === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
        if (dir === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
    }

    // Modal Top 5
    function openTopModal() {
        const container = document.getElementById('top-list-container');
        container.innerHTML = '';
        topScores.sort((a,b) => b.score - a.score);
        topScores.slice(0, 5).forEach((item, i) => {
            const el = document.createElement('div');
            el.className = 'top-item';
            el.innerHTML = `<span>#${i+1} ${item.name}</span><span>${item.score} PTS</span>`;
            container.appendChild(el);
        });
        document.getElementById('top-modal').classList.add('active');
    }

    function closeTopModal() {
        document.getElementById('top-modal').classList.remove('active');
    }

    // Teclado Virtual para Récords
    function buildKeyboard() {
        const keys = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['Z','X','C','V','B','N','M','DEL']
        ];
        const container = document.getElementById('keyboard');
        container.innerHTML = '';
        playerName = "";
        updateNameDisplay();

        keys.forEach(row => {
            const rowEl = document.createElement('div');
            rowEl.className = 'kb-row';
            row.forEach(k => {
                const btn = document.createElement('button');
                btn.className = `kb-key ${k === 'DEL' ? 'wide' : ''}`;
                btn.innerText = k;
                btn.onclick = () => {
                    if (k === 'DEL') playerName = playerName.slice(0, -1);
                    else if (playerName.length < 8) playerName += k;
                    updateNameDisplay();
                };
                rowEl.appendChild(btn);
            });
            container.appendChild(rowEl);
        });
    }

    function updateNameDisplay() {
        document.getElementById('name-display').innerText = playerName || "ESCRIBE...";
    }

    function submitScore() {
        const finalName = playerName.trim() || "RIDER";
        topScores.push({ name: finalName, score: score });
        topScores.sort((a,b) => b.score - a.score);
        topScores = topScores.slice(0, 5);
        localStorage.setItem('snake_snow_top', JSON.stringify(topScores));

        document.getElementById('crash-modal').classList.remove('active');
        location.reload();
    }
</script>
    </script>
</body>
</html>
