<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forfait Slot Machine - Alpine Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body {
            background: #020617;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }
        .casino-window {
            width: 420px;
            height: 520px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 3px solid #38bdf8;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(56, 189, 248, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .header {
            background: rgba(15, 23, 42, 0.9);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            z-index: 10;
        }
        .title-badge {
            font-family: 'Fredoka One', cursive;
            color: #38bdf8;
            font-size: 13px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stats-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .top-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            border: none;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }
        .slot-container {
            flex: 1;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            font-size: 18px;
            margin-bottom: 3px;
            font-family: 'Fredoka One', cursive;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .subtitle {
            color: #8b949e;
            font-size: 11px;
            margin-bottom: 12px;
        }
        .reels-container {
            display: flex;
            justify-content: space-between;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            width: 100%;
        }
        .reel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            user-select: none;
        }
        .spin-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        .spin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }
        .spin-btn:disabled {
            background: #30363d;
            color: #8b949e;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn-saka {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4) !important;
            margin-bottom: 8px;
        }
        .btn-saka:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6) !important;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: #0d1117;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid #30363d;
            margin-top: 5px;
        }
        .message {
            font-size: 12px;
            font-weight: bold;
            min-height: 18px;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        /* MODALES */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-title {
            font-family: 'Fredoka One', cursive;
            color: #fbbf24;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .top-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }
        .top-item {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
        }
        .keyboard-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            margin-top: 4px;
        }
        .kb-row { display: flex; justify-content: center; gap: 3px; }
        .kb-key {
            background: #334155;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            width: 26px;
            height: 28px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .kb-key:active { background: #38bdf8; color: black; }
        .kb-key.wide { width: 48px; background: #475569; }
        .name-display {
            background: #020617;
            border: 1px solid #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            min-width: 140px;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 6px;
        }
        .crash-text {
            color: #fbbf24;
            font-size: 18px;
            font-family: 'Fredoka One', cursive;
            margin-bottom: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="casino-window">
    <!-- HEADER -->
    <div class="header">
        <div class="title-badge">
            <span>🎫</span> SLOT FORFAIT
        </div>
        <div class="stats-bar">
            <button class="top-btn" onclick="openTopModal()">TOP 5</button>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL ESTÉTICA ORIGINAL EXACTA -->
    <div class="slot-container">
        <h2>🎫 FORFAIT SLOT</h2>
        <div class="subtitle">¡Consigue 3 iguales para ganar tu pase VIP!</div>

        <div class="reels-container">
            <div class="reel" id="reel1">🏂</div>
            <div class="reel" id="reel2">❄️</div>
            <div class="reel" id="reel3">⛷️</div>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spin()">¡TIRAR DE LA PALANCA!</button>
        <button class="spin-btn btn-saka" id="sakaBtn" onclick="aLaSaka()">¡A LA SAKA!</button>

        <div class="message" id="message">✨ ¡Prueba tu suerte, Rider!</div>

        <div class="stats">
            <span>Copos: <strong id="credits" style="color: #38bdf8;">100</strong></span>
            <span>Premios: <strong id="wins" style="color: #22c55e;">0</strong></span>
        </div>
    </div>

    <!-- MODAL TOP 5 -->
    <div class="modal-overlay" id="top-modal">
        <div class="modal-title">🏆 TOP 5 SAKAS</div>
        <div class="top-list" id="top-list-container"></div>
        <button class="spin-btn" onclick="closeTopModal()" style="width: 100%;">CERRAR</button>
    </div>

    <!-- MODAL RÉCORD (MÁX 5 LETRAS) -->
    <div class="modal-overlay" id="record-modal">
        <div class="crash-text">🏔️ ¡NUEVA SAKA RÉCORD!</div>
        <div style="font-size: 12px; margin-bottom: 6px;" id="final-score-text">Has conseguido 0 copos</div>
        <div class="name-display" id="name-display">_____</div>
        
        <div class="keyboard-container" id="keyboard"></div>
        
        <button class="spin-btn" onclick="submitScore()" style="width: 100%; margin-top: 10px;">GUARDAR RÉCORD</button>
    </div>
</div>

<script>
    const symbols = ['🏂', '❄️', '⛷️', '🏔️', '🎫', '🍺'];
    let credits = 100;
    let wins = 0;
    let playerName = "";

    let topScores = JSON.parse(localStorage.getItem('slot_forfait_top')) || [
        { name: "IVY", score: 250 },
        { name: "COLET", score: 200 },
        { name: "RIDER", score: 150 },
        { name: "POWDER", score: 100 },
        { name: "CARV", score: 50 }
    ];

    function spin() {
        if (credits < 10) {
            document.getElementById('message').innerText = "❌ ¡Sin copos! Recargando 50 copos...";
            credits += 50;
            document.getElementById('credits').innerText = credits;
            return;
        }

        credits -= 10;
        document.getElementById('credits').innerText = credits;
        
        const btn = document.getElementById('spinBtn');
        const sakaBtn = document.getElementById('sakaBtn');
        btn.disabled = true;
        sakaBtn.disabled = true;
        document.getElementById('message').innerText = "🌀 Girando rodillos...";

        let spinsCount = 0;
        const interval = setInterval(() => {
            document.getElementById('reel1').innerText = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('reel2').innerText = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('reel3').innerText = symbols[Math.floor(Math.random() * symbols.length)];
            spinsCount++;

            if (spinsCount > 15) {
                clearInterval(interval);
                finalizeSpin();
            }
        }, 80);
    }

    function finalizeSpin() {
        const r1 = symbols[Math.floor(Math.random() * symbols.length)];
        const r2 = symbols[Math.floor(Math.random() * symbols.length)];
        const r3 = symbols[Math.floor(Math.random() * symbols.length)];

        document.getElementById('reel1').innerText = r1;
        document.getElementById('reel2').innerText = r2;
        document.getElementById('reel3').innerText = r3;

        const msg = document.getElementById('message');

        if (r1 === r2 && r2 === r3) {
            if (r1 === '🎫') {
                msg.innerHTML = "🎉 ¡JACKPOT! ¡FORFAIT VIP TEMPORADA! (+200 copos)";
                credits += 200;
            } else {
                msg.innerHTML = `🎉 ¡TRIPLE ${r1}! ¡PREMIO MAYOR! (+100 copos)`;
                credits += 100;
            }
            wins++;
            document.getElementById('wins').innerText = wins;
        } else if (r1 === r2 || r2 === r3 || r1 === r3) {
            msg.innerHTML = "✨ ¡Pareja! Recuperas 15 copos.";
            credits += 15;
        } else {
            msg.innerText = "💥 ¡Sigue intentándolo!";
        }

        document.getElementById('credits').innerText = credits;
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('sakaBtn').disabled = false;
    }

    function aLaSaka() {
        if (credits <= 0) {
            alert("No tienes copos acumulados para llevarte a la saca.");
            return;
        }

        const lowestScore = topScores.length < 5 ? 0 : topScores[topScores.length - 1].score;

        if (credits > lowestScore || topScores.length < 5) {
            document.getElementById('final-score-text').innerText = `¡Te retiras con ${credits} copos!`;
            document.getElementById('record-modal').classList.add('active');
            buildKeyboard();
        } else {
            alert(`¡Te has retirado con ${credits} copos, pero no alcanza para el Top 5!`);
            credits = 100;
            wins = 0;
            document.getElementById('credits').innerText = credits;
            document.getElementById('wins').innerText = wins;
        }
    }

    function openTopModal() {
        const container = document.getElementById('top-list-container');
        container.innerHTML = '';
        topScores.sort((a,b) => b.score - a.score);
        topScores.slice(0, 5).forEach((item, i) => {
            const el = document.createElement('div');
            el.className = 'top-item';
            el.innerHTML = `<span>#${i+1} ${item.name}</span><span>${item.score} COPOS</span>`;
            container.appendChild(el);
        });
        document.getElementById('top-modal').classList.add('active');
    }

    function closeTopModal() {
        document.getElementById('top-modal').classList.remove('active');
    }

    function buildKeyboard() {
        const keys = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['Z','X','C','V','B','N','M','DEL']
        ];
        const container = document.getElementById('keyboard');
        container.innerHTML = '';
        playerName = "";
        updateNameDisplay();

        keys.forEach(row => {
            const rowEl = document.createElement('div');
            rowEl.className = 'kb-row';
            row.forEach(k => {
                const btn = document.createElement('button');
                btn.className = `kb-key ${k === 'DEL' ? 'wide' : ''}`;
                btn.innerText = k;
                btn.onclick = () => {
                    if (k === 'DEL') {
                        playerName = playerName.slice(0, -1);
                    } else if (playerName.length < 5) { // Máximo 5 letras
                        playerName += k;
                    }
                    updateNameDisplay();
                };
                rowEl.appendChild(btn);
            });
            container.appendChild(rowEl);
        });
    }

    function updateNameDisplay() {
        let padded = playerName.padEnd(5, '_');
        document.getElementById('name-display').innerText = padded;
    }

    function submitScore() {
        const finalName = playerName.trim() || "RIDER";
        topScores.push({ name: finalName, score: credits });
        topScores.sort((a,b) => b.score - a.score);
        topScores = topScores.slice(0, 5);
        localStorage.setItem('slot_forfait_top', JSON.stringify(topScores));

        document.getElementById('record-modal').classList.remove('active');
        credits = 100;
        wins = 0;
        document.getElementById('credits').innerText = credits;
        document.getElementById('wins').innerText = wins;
        openTopModal();
    }
</script>

</body>
</html>
