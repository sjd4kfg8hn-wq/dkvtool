<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Forfait - Alpine Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --snow-white: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-teal: #2dd4bf;
            --gold: #fbbf24;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #020617;
            font-family: 'Nunito', sans-serif;
            color: var(--snow-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .casino-window {
            width: 420px;
            height: 520px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 3px solid var(--accent-blue);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(56, 189, 248, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .header {
            background: rgba(15, 23, 42, 0.9);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            z-index: 10;
        }

        .title-badge {
            font-family: 'Fredoka One', cursive;
            color: var(--accent-blue);
            font-size: 13px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stat-item {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
        }

        .stat-item span { color: var(--gold); }

        .top-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            border: none;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }

        .game-canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            gap: 16px;
        }

        /* Ruletas Originales con borde Teal */
        .slot-frame {
            background: #090d16;
            border: 3px solid var(--accent-teal);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 15px rgba(45, 212, 191, 0.2);
        }

        .slot-reel {
            width: 70px;
            height: 80px;
            background: #0f172a;
            border: 2px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
            transition: transform 0.05s ease;
        }

        .slot-reel.spinning {
            filter: blur(1px);
        }

        .forfait-bag-badge {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--gold);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            color: var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }

        .btn-start {
            flex: 1;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: 1px solid var(--accent-blue);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-saka {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            border-color: #34d399 !important;
        }

        /* MODALES */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            font-family: 'Fredoka One', cursive;
            color: var(--gold);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .top-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .top-item {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
        }

        .keyboard-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            margin-top: 4px;
        }

        .kb-row { display: flex; justify-content: center; gap: 3px; }
        .kb-key {
            background: #334155;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            width: 26px;
            height: 28px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .kb-key:active { background: var(--accent-blue); color: black; }
        .kb-key.wide { width: 48px; background: #475569; }

        .name-display {
            background: #020617;
            border: 1px solid var(--accent-blue);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 800;
            color: var(--snow-white);
            min-width: 140px;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 6px;
        }

        .crash-text {
            color: var(--gold);
            font-size: 20px;
            font-family: 'Fredoka One', cursive;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="casino-window">
        <!-- HEADER -->
        <div class="header">
            <div class="title-badge">
                <span>🎫</span> SLOT FORFAIT
            </div>
            <div class="stats-bar">
                <div class="stat-item">RÉCORD: <span id="record-val">25</span></div>
                <button class="top-btn" onclick="openTopModal()">TOP 5</button>
            </div>
        </div>

        <!-- ÁREA DE JUEGO ORIGINAL -->
        <div class="game-canvas-container">
            <div class="slot-frame">
                <div class="slot-reel" id="reel1">❄️</div>
                <div class="slot-reel" id="reel2">❄️</div>
                <div class="slot-reel" id="reel3">🏂</div>
            </div>

            <div class="forfait-bag-badge">
                🎟️ Forfaits en saca: <span id="bag-val">10</span>
            </div>

            <div class="button-group">
                <button class="btn-start" id="spin-btn" onclick="spinSlot()">GIRAR (1 🎟️)</button>
                <button class="btn-start btn-saka" id="saka-btn" onclick="aLaSaka()">¡A LA SAKA!</button>
            </div>
        </div>

        <!-- MODAL TOP 5 -->
        <div class="modal-overlay" id="top-modal">
            <div class="modal-title">🏆 TOP 5 SAKAS</div>
            <div class="top-list" id="top-list-container"></div>
            <button class="btn-start" onclick="closeTopModal()" style="width: 100%;">CERRAR</button>
        </div>

        <!-- MODAL RÉCORD (MÁXIMO 5 LETRAS) -->
        <div class="modal-overlay" id="crash-modal">
            <div class="crash-text">🏔️ ¡A LA SAKA RECORD!</div>
            <div style="font-size: 12px; margin-bottom: 6px;" id="final-score-text">Has conseguido 0 forfaits</div>
            <div class="name-display" id="name-display">_____</div>
            
            <div class="keyboard-container" id="keyboard"></div>
            
            <button class="btn-start" onclick="submitScore()" style="width: 100%; margin-top: 10px;">GUARDAR Y REINICIAR</button>
        </div>
    </div>

    <script>
        const symbols = ['🎿', '🏂', '❄️', '🪨', '🏆'];
        let currentBag = 10;
        let isSpinning = false;
        let playerName = "";

        let topScores = JSON.parse(localStorage.getItem('slot_forfait_top')) || [
            { name: "IVY", score: 25 },
            { name: "COLET", score: 20 },
            { name: "RIDER", score: 15 },
            { name: "POWDER", score: 10 },
            { name: "CARV", score: 5 }
        ];

        function updateStats() {
            document.getElementById('bag-val').innerText = currentBag;
            const highestScore = topScores.length > 0 ? Math.max(...topScores.map(s => s.score)) : 0;
            document.getElementById('record-val').innerText = highestScore;
        }

        function spinSlot() {
            if (isSpinning) return;
            if (currentBag < 1) {
                alert("¡No te quedan forfaits para girar! Pulsa ¡A LA SAKA! si quieres registrar tus puntos.");
                return;
            }

            // Descontar la apuesta de 1 forfait
            currentBag--;
            updateStats();
            isSpinning = true;

            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;

            const reel1 = document.getElementById('reel1');
            const reel2 = document.getElementById('reel2');
            const reel3 = document.getElementById('reel3');

            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            reel3.classList.add('spinning');

            // Efecto visual de animación giratoria rápida
            let counter = 0;
            const interval = setInterval(() => {
                reel1.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                reel2.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                reel3.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                counter++;

                if (counter > 15) {
                    clearInterval(interval);
                    
                    // Elegir resultados finales de verdad
                    const final1 = symbols[Math.floor(Math.random() * symbols.length)];
                    const final2 = symbols[Math.floor(Math.random() * symbols.length)];
                    const final3 = symbols[Math.floor(Math.random() * symbols.length)];

                    reel1.innerText = final1;
                    reel1.classList.remove('spinning');

                    setTimeout(() => {
                        reel2.innerText = final2;
                        reel2.classList.remove('spinning');
                    }, 150);

                    setTimeout(() => {
                        reel3.innerText = final3;
                        reel3.classList.remove('spinning');

                        // LÓGICA DE PREMIOS REAL
                        let prize = 0;
                        if (final1 === final2 && final2 === final3) {
                            prize = final1 === '🏆' ? 20 : 10; // Trío
                        } else if (final1 === final2 || final2 === final3 || final1 === final3) {
                            prize = 3; // Pareja
                        } // Si no hay coincidencias, 0 premios (pierde el forfait)

                        currentBag += prize;
                        updateStats();
                        isSpinning = false;
                        spinBtn.disabled = false;
                    }, 300);
                }
            }, 60);
        }

        function aLaSaka() {
            if (isSpinning) return;
            if (currentBag <= 0) {
                alert("No tienes forfaits para meter en la saca.");
                return;
            }

            const lowestScore = topScores.length < 5 ? 0 : topScores[topScores.length - 1].score;

            if (currentBag > lowestScore || topScores.length < 5) {
                document.getElementById('final-score-text').innerText = `¡Te retiras con ${currentBag} forfaits!`;
                document.getElementById('crash-modal').classList.add('active');
                buildKeyboard();
            } else {
                alert(`¡Has guardado ${currentBag} forfaits en la saca, pero no entra en el Top 5!`);
                currentBag = 10; // Reiniciar
                updateStats();
            }
        }

        function openTopModal() {
            const container = document.getElementById('top-list-container');
            container.innerHTML = '';
            topScores.sort((a,b) => b.score - a.score);
            topScores.slice(0, 5).forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'top-item';
                el.innerHTML = `<span>#${i+1} ${item.name}</span><span>${item.score} FORFAITS</span>`;
                container.appendChild(el);
            });
            document.getElementById('top-modal').classList.add('active');
        }

        function closeTopModal() {
            document.getElementById('top-modal').classList.remove('active');
        }

        function buildKeyboard() {
            const keys = [
                ['Q','W','E','R','T','Y','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L'],
                ['Z','X','C','V','B','N','M','DEL']
            ];
            const container = document.getElementById('keyboard');
            container.innerHTML = '';
            playerName = "";
            updateNameDisplay();

            keys.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'kb-row';
                row.forEach(k => {
                    const btn = document.createElement('button');
                    btn.className = `kb-key ${k === 'DEL' ? 'wide' : ''}`;
                    btn.innerText = k;
                    btn.onclick = () => {
                        if (k === 'DEL') {
                            playerName = playerName.slice(0, -1);
                        } else if (playerName.length < 5) { // Máximo 5 caracteres
                            playerName += k;
                        }
                        updateNameDisplay();
                    };
                    rowEl.appendChild(btn);
                });
                container.appendChild(rowEl);
            });
        }

        function updateNameDisplay() {
            let padded = playerName.padEnd(5, '_');
            document.getElementById('name-display').innerText = padded;
        }

        function submitScore() {
            const finalName = playerName.trim() || "RIDER";
            topScores.push({ name: finalName, score: currentBag });
            topScores.sort((a,b) => b.score - a.score);
            topScores = topScores.slice(0, 5);
            localStorage.setItem('slot_forfait_top', JSON.stringify(topScores));

            document.getElementById('crash-modal').classList.remove('active');
            currentBag = 10;
            updateStats();
            openTopModal();
        }

        updateStats();
    </script>
</body>
</html>
