<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnowZoneSamplerbox - House Groovebox</title>
    <!-- Tipografía estilo grafiti (Permanent Marker) -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

       body {
    background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    font-family: 'Rajdhani', sans-serif;
    color: #e2e8f0;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: auto;
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
}

/* Consola principal estilo chasis de nieve / aluminio helado */
.snow-console {
    width: 100%;
    max-width: 740px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 3px solid #38bdf8;
    border-radius: 16px;
    box-shadow: 0 0 35px rgba(56, 189, 248, 0.3), inset 0 0 20px rgba(56, 189, 248, 0.1);
    padding: 10px 14px; /* Reducido para compactar en vertical */
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
}

        /* Cabecera con Marca Grafiti */
        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(56, 189, 248, 0.3);
            padding-bottom: 10px;
        }

        .brand-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 26px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            letter-spacing: 1px;
        }

        .status-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
        }

        .lcd-screen {
            background: #020617;
            border: 2px solid #38bdf8;
            border-radius: 6px;
            padding: 5px 12px;
            color: #38bdf8;
            font-family: monospace;
            box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Controles superiores (BPM y Botón Master / REC) */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .btn-control {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
        }

        .btn-control:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 10px #38bdf8;
        }

        .btn-control.recording {
            background: #ef4444;
            border-color: #f87171;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Rejilla de 16 Pads de Loops */
        .pads-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .pad {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 12px;
            height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .pad:active, .pad.active {
            transform: scale(0.96);
        }

        /* Colores temáticos por fila para los pads de House */
        .pad.row-0 { border-color: #f43f5e; } /* Kicks */
        .pad.row-1 { border-color: #fb923c; } /* Percs / Claps */
        .pad.row-2 { border-color: #38bdf8; } /* Basslines */
        .pad.row-3 { border-color: #c084fc; } /* Synths / Vocals / FX */

        .pad.row-0.active { background: rgba(244, 63, 94, 0.25); box-shadow: 0 0 15px #f43f5e; border-color: #fff; }
        .pad.row-1.active { background: rgba(251, 146, 60, 0.25); box-shadow: 0 0 15px #fb923c; border-color: #fff; }
        .pad.row-2.active { background: rgba(56, 189, 248, 0.25); box-shadow: 0 0 15px #38bdf8; border-color: #fff; }
        .pad.row-3.active { background: rgba(192, 132, 252, 0.25); box-shadow: 0 0 15px #c084fc; border-color: #fff; }

        .pad-num {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 10px;
            color: #64748b;
            font-weight: bold;
        }

        .pad-name {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            padding: 0 5px;
            margin-top: 10px;
            color: #cbd5e1;
        }

        .pad.active .pad-name {
            color: #fff;
            text-shadow: 0 0 8px currentColor;
        }

        .pad-status {
            font-size: 9px;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 1px;
            color: #64748b;
        }

        .pad.active .pad-status {
            color: #38bdf8;
            font-weight: bold;
        }

        /* Barra inferior de volumen / master */
        .console-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #64748b;
            padding-top: 5px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="snow-console">
        <!-- Cabecera -->
        <div class="console-header">
            <div class="brand-title">SnowZoneSamplerbox</div>
            <div class="status-panel">
                <span>TEMPO: <strong id="bpm-display" style="color: #38bdf8;">124</strong> BPM</span>
                <div class="lcd-screen" id="lcd-msg">LISTO PARA MEZCLAR</div>
            </div>
        </div>
        
<!-- Selector de BPM y Estilos Musicales -->
<div class="genre-bpm-bar" style="display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); padding: 12px 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #38bdf8;">
    
    <!-- Slider y Display de BPM -->
    <div style="display: flex; align-items: center; gap: 12px; color: #38bdf8; font-weight: bold;">
        <span>BPM: <span id="bpm-value">124</span></span>
        <input type="range" id="bpm-range" min="80" max="180" value="124" step="1" oninput="changeBPM(this.value)" style="accent-color: #38bdf8; cursor: pointer;">
    </div>

    <!-- Botones de Género -->
    <div style="display: flex; gap: 8px;">
        <button class="btn-control genre-btn active" onclick="selectGenre('house')">🏠 House</button>
        <button class="btn-control genre-btn" onclick="selectGenre('psy')">🌀 Psy</button>
        <button class="btn-control genre-btn" onclick="selectGenre('hiphop')">🎤 Hip Hop</button>
        <button class="btn-control genre-btn" onclick="selectGenre('dnb')">⚡ D&B</button>
    </div>
</div>
        <!-- Barra de Control y Grabación -->
        <div class="controls-bar">
            <div style="display: flex; gap: 10px;">
                <button class="btn-control" onclick="togglePlayAll()">▶️ MASTER PLAY</button>
                <button class="btn-control" onclick="stopAllPads()">⏹️ PARAR TODO</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-control" id="rec-btn" onclick="toggleRecording()">🔴 REC MIX</button>
                <button class="btn-control" onclick="playRecording()">⏯️ PLAY REC</button>
            </div>
        </div>

        <!-- Rejilla de 16 Pads -->
        <div class="pads-grid" id="pads-container">
            <!-- Se generan dinámicamente mediante JS -->
        </div>

        <!-- Pie -->
        <div class="console-footer">
            <span>HOUSE LOOP SAMPLER ENGINE (WEB AUDIO API)</span>
            <span>SNOW CONSOLE EDITION</span>
        </div>
    </div>

    <script>
        let audioCtx = null;
       let BPM = 124;
let beatInterval = (60 / BPM) * 1000; // Duración de un pulso
        
        let isPlayingAll = false;
        let isRecording = false;
        let recordedActions = [];
        let recStartTime = 0;
        let activeLoops = {};
        let loopIntervals = {};
// Función para actualizar BPM manualmente con la barra
function changeBPM(val) {
    BPM = parseInt(val);
    beatInterval = (60 / BPM) * 1000;
    const bpmDisplay = document.getElementById('bpm-value');
    if (bpmDisplay) bpmDisplay.innerText = BPM;
}

// Función para cambiar de género musical y ajustar su tempo
function selectGenre(genre) {
    // Cambiar la pestaña activa visualmente
    document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }

    // BPMs predeterminados por estilo
    if (genre === 'house') BPM = 124;
    else if (genre === 'psy') BPM = 142;
    else if (genre === 'hiphop') BPM = 90;
    else if (genre === 'dnb') BPM = 174;

    // Actualizar interval y controles visuales
    beatInterval = (60 / BPM) * 1000;
    const slider = document.getElementById('bpm-range');
    if (slider) slider.value = BPM;
    const bpmDisplay = document.getElementById('bpm-value');
    if (bpmDisplay) bpmDisplay.innerText = BPM;
}
        // Definición de los 16 Loops de House
        const padsData = [
            { id: 0, name: "4x4 Deep Kick", type: "kick", row: 0 },
            { id: 1, name: "Sub Kick Heavy", type: "subkick", row: 0 },
            { id: 2, name: "Electro Kick", type: "eleckick", row: 0 },
            { id: 3, name: "Rumble Kick", type: "rumble", row: 0 },
            
            { id: 4, name: "909 Off-Hat", type: "hihat", row: 1 },
            { id: 5, name: "Crisp Claps", type: "clap", row: 1 },
            { id: 6, name: "Rimshot Groove", type: "rim", row: 1 },
            { id: 7, name: "Shaker Loop", type: "shaker", row: 1 },
            
            { id: 8, name: "Deep Bassline", type: "bass1", row: 2 },
            { id: 9, name: "Acid Bass Stride", type: "bass2", row: 2 },
            { id: 10, name: "Sub Bass Pulse", type: "bass3", row: 2 },
            { id: 11, name: "Sub Groove Alt", type: "bass4", row: 2 },
            
            { id: 12, name: "Piano Chord St. 1", type: "synth1", row: 3 },
            { id: 13, name: "Piano Chord St. 2", type: "synth2", row: 3 },
            { id: 14, name: "Vocal Chop 'Hey'", type: "vocal", row: 3 },
            { id: 15, name: "Snow FX Rise", type: "fx", row: 3 }
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Construir la interfaz de los 16 pads
        const container = document.getElementById('pads-container');
        padsData.forEach(p => {
            const pad = document.createElement('div');
            pad.className = `pad row-${p.row}`;
            pad.id = `pad-${p.id}`;
            pad.innerHTML = `
                <span class="pad-num">${p.id + 1}</span>
                <span class="pad-name">${p.name}</span>
                <span class="pad-status" id="status-${p.id}">OFF</span>
            `;
            pad.onclick = () => togglePad(p.id);
            container.appendChild(pad);
        });

        function togglePad(id) {
            initAudio();
            if (activeLoops[id]) {
                stopLoop(id);
            } else {
                startLoop(id);
            }

            if (isRecording) {
                recordedActions.push({ id, time: Date.now() - recStartTime, state: activeLoops[id] ? 'ON' : 'OFF' });
            }
        }

        function startLoop(id) {
            activeLoops[id] = true;
            document.getElementById(`pad-${id}`).classList.add('active');
            document.getElementById(`status-${id}`).innerText = 'ON';
            document.getElementById('lcd-msg').innerText = `LOOP [${padsData[id].name}] ACTIVADO`;

            // Ejecutar primer golpe inmediato
            triggerSound(padsData[id].type);

            // Programar bucle rítmico según el tipo de sonido
            let intervalTime = beatInterval; // Por defecto a negras
            if (padsData[id].type === 'hihat' || padsData[id].type === 'shaker') {
                intervalTime = beatInterval / 2; // Corcheas
            } else if (padsData[id].type.includes('bass') || padsData[id].type.includes('synth')) {
                intervalTime = beatInterval;
            }

            loopIntervals[id] = setInterval(() => {
                if (activeLoops[id]) {
                    triggerSound(padsData[id].type);
                }
            }, intervalTime);
        }

        function stopLoop(id) {
            activeLoops[id] = false;
            document.getElementById(`pad-${id}`).classList.remove('active');
            document.getElementById(`status-${id}`).innerText = 'OFF';
            clearInterval(loopIntervals[id]);
            document.getElementById('lcd-msg').innerText = `LOOP [${padsData[id].name}] SILENCIADO`;
        }

        // Sintetizador de sonidos de House en tiempo real (Web Audio API)
        function triggerSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;

            if (type === 'kick' || type === 'subkick' || type === 'eleckick' || type === 'rumble') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let startFreq = type === 'rumble' ? 130 : 150;
                osc.frequency.setValueAtTime(startFreq, t);
                osc.frequency.exponentialRampToValueAtTime(35, t + 0.15);

                gain.gain.setValueAtTime(1.0, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);

                osc.start(t);
                osc.stop(t + 0.4);
            } 
            else if (type === 'hihat' || type === 'shaker') {
                // Ruido blanco filtrado en agudos
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 7000;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start(t);
            }
            else if (type === 'clap') {
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.6, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start(t);
            }
            else if (type === 'rim') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(200, t + 0.04);
                
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.04);
            }
            else if (type.includes('bass')) {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc.type = type === 'acidbass' ? 'sawtooth' : 'square';
                osc.frequency.setValueAtTime(55, t); // Nota La1

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, t);
                filter.frequency.exponentialRampToValueAtTime(150, t + 0.2);

                gain.gain.setValueAtTime(0.7, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(t);
                osc.stop(t + 0.25);
            }
            else if (type.includes('synth') || type === 'vocal') {
                // Acorde sintético house / stabs
                [220, 277.18, 329.63].forEach(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, t);

                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + 0.3);
                });
            }
            else if (type === 'fx') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.linearRampToValueAtTime(1200, t + 0.4);

                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.4);
            }
        }

        function stopAllPads() {
            padsData.forEach(p => {
                if (activeLoops[p.id]) stopLoop(p.id);
            });
            document.getElementById('lcd-msg').innerText = "TODOS LOS LOOPS PARADOS";
        }

        let masterPlay = false;
        function togglePlayAll() {
            initAudio();
            masterPlay = !masterPlay;
            if (masterPlay) {
                // Activar base por defecto (Kick + HiHat + Bass)
                startLoop(0); // Kick
                startLoop(4); // HiHat
                startLoop(8); // Bassline
                document.getElementById('lcd-msg').innerText = "MASTER PLAY: BASE HOUSE ACTIVA";
            } else {
                stopAllPads();
            }
        }

        function toggleRecording() {
            isRecording = !isRecording;
            const btn = document.getElementById('rec-btn');
            if (isRecording) {
                recordedActions = [];
                recStartTime = Date.now();
                btn.classList.add('recording');
                btn.innerText = "⏹️ STOP REC";
                document.getElementById('lcd-msg').innerText = "GRABANDO SESIÓN EN DIRECTO...";
            } else {
                btn.classList.remove('recording');
                btn.innerText = "🔴 REC MIX";
                document.getElementById('lcd-msg').innerText = `SESIÓN GUARDADA (${recordedActions.length} acciones)`;
            }
        }

        function playRecording() {
            if (recordedActions.length === 0) {
                document.getElementById('lcd-msg').innerText = "NO HAY NINGUNA SESIÓN GRABADA";
                return;
            }
            stopAllPads();
            document.getElementById('lcd-msg').innerText = "REPRODUCIENDO SESIÓN GRABADA...";
            
            recordedActions.forEach(action => {
                setTimeout(() => {
                    togglePad(action.id);
                }, action.time);
            });
        }
    </script>
</body>
</html>
